<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanh toán - Mít Sấy Vũ Trụ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}</style>
</head>
<body class="bg-yellow-50 text-slate-800">
  <!-- Header -->
  <header class="bg-white shadow-sm sticky top-0 z-40">
    <nav class="container mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full bg-yellow-100 grid place-items-center">🥭</div>
        <div>
          <h1 class="text-xl font-bold">Mít Sấy Vũ Trụ</h1>
          <p class="text-xs text-slate-600">Giòn thơm quay vị giác</p>
        </div>
      </a>
      <a href="index.html#products" class="text-amber-600 hover:underline">Tiếp tục mua hàng</a>
    </nav>
  </header>

  <!-- Main -->
  <main class="container mx-auto px-4 py-8">
    <h2 class="text-2xl md:text-3xl font-bold mb-6">Thanh toán</h2>

    <div class="grid lg:grid-cols-3 gap-8">
      <!-- Form -->
      <section class="lg:col-span-2 bg-white rounded-xl shadow p-6">
        <h3 class="text-xl font-semibold mb-4">Thông tin người nhận</h3>

        <form id="checkoutForm" class="space-y-4">
          <div>
            <label class="block text-sm mb-1" for="fullname">Họ và tên</label>
            <input id="fullname" name="fullname" type="text" required
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-500"
                   placeholder="Nguyễn Văn A">
          </div>

          <div class="grid md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm mb-1" for="phone">Số điện thoại</label>
              <input id="phone" name="phone" type="tel" required
                     pattern="^(0|\\+84)[0-9]{9,10}$"
                     class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-500"
                     placeholder="098xxxxxxx">
              <p class="text-xs text-slate-500 mt-1">Định dạng: 0xxxxxxxxx hoặc +84xxxxxxxxx</p>
            </div>
            <div>
              <label class="block text-sm mb-1" for="email">Email</label>
              <input id="email" name="email" type="email" required
                     class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-500"
                     placeholder="ban@example.com">
            </div>
          </div>

          <div>
            <label class="block text-sm mb-1" for="address">Địa chỉ giao hàng</label>
            <input id="address" name="address" type="text" required
                   class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-500"
                   placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành">
          </div>

          <div>
            <label class="block text-sm mb-1" for="note">Ghi chú đơn hàng</label>
            <textarea id="note" name="note" rows="3"
                      class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:border-amber-500"
                      placeholder="Ví dụ: Giao giờ hành chính, gọi trước khi giao..."></textarea>
          </div>

          <div class="flex items-center gap-3 pt-2">
            <button id="submitBtn" type="submit"
                    class="bg-amber-500 hover:bg-amber-600 text-white px-6 py-3 rounded-lg font-semibold">
              Xác nhận đặt hàng
            </button>
            <span id="statusText" class="text-sm text-slate-500"></span>
          </div>
        </form>
      </section>

      <!-- Summary -->
      <aside class="bg-white rounded-xl shadow p-6 h-max">
        <h3 class="text-xl font-semibold mb-4">Đơn hàng của bạn</h3>
        <div id="cartSummary" class="divide-y"></div>
        <div class="pt-4 mt-4 border-t">
          <div class="flex justify-between items-center">
            <span class="font-semibold">Tổng cộng:</span>
            <span id="grandTotal" class="font-bold text-lg text-amber-600">0₫</span>
          </div>
        </div>

        <!-- Ẩn dùng để truyền vào EmailJS -->
        <div class="hidden">
          <div id="orderList"></div>
          <div id="orderTotal"></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="bg-slate-800 text-white py-10 mt-10">
    <div class="container mx-auto px-4 text-center text-sm text-gray-300">
      © 2024 Mít Sấy Vũ Trụ
    </div>
  </footer>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    // ====== EMAILJS ======
    const EMAILJS_SERVICE_ID = 'service_92aaxmn';
    const EMAILJS_TEMPLATE_ID = 'template_i2dewcv';
    const EMAILJS_PUBLIC_KEY  = 'b40L89aibcM57zhOV';

    // ====== GOOGLE SHEET API ======
    const TRACK_API = 'https://script.google.com/macros/s/AKfycbwrwR5pjtkkFVo4Cl9WJmYL0ahysVM50JnbGRYTMpkI8wVjeM3jbhcWSRsrXtUFzxCI/exec';
    const API_KEY   = 'CHANGE_ME_123'; // trùng với API_SECRET

    // ====== Cart render ======
    let cart = JSON.parse(localStorage.getItem('mitSayCart')) || [];

    const cartBox  = document.getElementById('cartSummary');
    const totalBox = document.getElementById('grandTotal');
    const orderListEl  = document.getElementById('orderList');
    const orderTotalEl = document.getElementById('orderTotal');

    function renderSummary(){
      if(!cart || cart.length===0){
        cartBox.innerHTML = '<p class="py-2 text-slate-500">Giỏ hàng đang trống. <a class="text-amber-600 underline" href="index.html#products">Mua thêm</a></p>';
        totalBox.textContent = '0₫';
        orderListEl.innerHTML = '';
        orderTotalEl.textContent = '0₫';
        return;
      }
      cartBox.innerHTML = cart.map(i=>`
        <div class="py-3 flex items-center justify-between">
          <div>
            <div class="font-medium">${i.name}</div>
            <div class="text-sm text-slate-500">SL: ${i.quantity} × ${i.price.toLocaleString()}₫</div>
          </div>
          <div class="font-semibold">${(i.price*i.quantity).toLocaleString()}₫</div>
        </div>
      `).join('');
      const sum = cart.reduce((s,i)=>s + i.price*i.quantity, 0);
      totalBox.textContent = sum.toLocaleString() + '₫';
      orderListEl.innerHTML = cart
        .map(i => `${i.name} x${i.quantity} = ${(i.price*i.quantity).toLocaleString()}₫`)
        .join('<br>');
      orderTotalEl.textContent = sum.toLocaleString() + '₫';
    }
    renderSummary();
    if(!cart || cart.length===0){ setTimeout(()=>{ window.location.href = 'index.html#products'; }, 1200); }

    function cartToSummary() {
      const itemsText = cart.map(i => `${i.name} x${i.quantity}`).join('; ');
      const totalVND  = cart.reduce((s,i)=>s + i.price*i.quantity, 0);
      return { itemsText, totalVND };
    }

    async function pushOrderToSheet(order){
      try{
        const res = await fetch(TRACK_API, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ key: API_KEY, ...order })
        });
        return await res.json();
      }catch(err){
        console.error('Lỗi gửi Sheet:', err);
        return { ok:false, error:String(err) };
      }
    }

    (function(){ if(EMAILJS_PUBLIC_KEY!=='YOUR_PUBLIC_KEY') emailjs.init(EMAILJS_PUBLIC_KEY); })();

    const form = document.getElementById('checkoutForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusText = document.getElementById('statusText');

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(!cart || cart.length===0){ alert('Giỏ hàng trống'); return; }

      const orderId = 'MSV-' + Date.now();
      const { itemsText, totalVND } = cartToSummary();

      const dataEmail = {
        order_id: orderId,
        fullname: form.fullname.value.trim(),
        email:    form.email.value.trim(),
        phone:    form.phone.value.trim(),
        address:  form.address.value.trim(),
        note:     form.note.value.trim(),   // gửi ghi chú trong email
        items:    orderListEl.innerHTML,
        total:    orderTotalEl.textContent
      };

      const dataSheet = {
        id: orderId,
        name:       form.fullname.value.trim(),
        email:      form.email.value.trim(),
        phone:      form.phone.value.trim(),
        address:    form.address.value.trim(),
        ordered_at: new Date().toLocaleString('vi-VN'),
        items:      itemsText,
        price:      totalVND,               // cPRICE = cột "Giá tiền" trên sheet
        status:     'đã xác nhận',
        tracking:   '',
        note:       form.note.value.trim()  // ✅ QUAN TRỌNG: gửi ghi chú để ghi vào cột J
      };

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70');
      statusText.textContent = 'Đang gửi đơn hàng...';

      try{
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, dataEmail);
        const sheetRes = await pushOrderToSheet(dataSheet);
        if(!sheetRes?.ok){ console.warn('Ghi Sheet lỗi:', sheetRes); }
        statusText.textContent = 'Đã gửi thành công! Cảm ơn bạn.';
        localStorage.removeItem('mitSayCart');
        setTimeout(()=>{ window.location.href='track.html?q='+encodeURIComponent(orderId); }, 1200);
      }catch(err){
        console.error(err);
        alert('Gửi đơn thất bại. Vui lòng kiểm tra cấu hình.\nChi tiết: ' + (err?.text || JSON.stringify(err)));
        statusText.textContent = '';
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70');
      }
    });
  </script>
</body>
</html>
