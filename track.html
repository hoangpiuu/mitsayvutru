<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Theo dõi đơn hàng | Mít Sấy Vũ Trụ</title>
  <script src="/favicon.js" defer></script>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>

<body class="bg-white text-gray-900">

  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-center text-amber-600 mb-6">Tra cứu đơn hàng</h1>

    <!-- Form tra cứu -->
    <form id="orderTrackForm" class="space-y-4">
      <input id="orderTrackInput" type="text"
        placeholder="Nhập mã đơn hàng hoặc email"
        class="border border-gray-300 rounded-lg w-full p-3 focus:ring-2 focus:ring-amber-400 focus:outline-none" />

      <button type="submit"
  class="w-full bg-black hover:bg-gray-800 text-white font-semibold py-3 rounded-lg transition-colors">
  Tra cứu
</button>
    </form>

    <!-- Kết quả hiển thị -->
    <div id="orderTrackResult" class="hidden mt-6"></div>
  </main>

  <footer class="text-center text-xs text-gray-500 py-10">
    © 2025 Mít Sấy Vũ Trụ
  </footer>

  <script>
  // === DÁN LINK API CỦA BẠN Ở ĐÂY ===
  const TRACK_API = 'https://script.google.com/macros/s/AKfycbwrwR5pjtkkFVo4Cl9WJmYL0ahysVM50JnbGRYTMpkI8wVjeM3jbhcWSRsrXtUFzxCI/exec'; // ← thay bằng link Web App URL bạn có

  // Hàm gọi API
async function lookupOrder(q){
  const url = TRACK_API + '?q=' + encodeURIComponent(q);
  const res = await fetch(url); // không headers
  const json = await res.json();
  return json.ok ? json.order : null;
}

  // Chuyển trạng thái
  function toStatusText(s){
    const raw = String(s || '').toLowerCase();
    if (raw.includes('xác nhận')) return '✅ Đã xác nhận';
    if (raw.includes('chuẩn bị')) return '📦 Đang chuẩn bị đơn';
    if (raw.includes('giao hàng')) return '🚚 Đang giao hàng';
    if (raw.includes('hoàn thành')) return '🎉 Hoàn thành đơn hàng';
    return s || '⏳ Đang xử lý';
  }

  // Form xử lý tra cứu
  document.addEventListener('DOMContentLoaded', ()=>{
    const form = document.getElementById('orderTrackForm');
    const input = document.getElementById('orderTrackInput');
    const box = document.getElementById('orderTrackResult');

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const q = input.value.trim();
      if (!q) return;

      box.innerHTML = `<p class="text-gray-500">Đang tra cứu...</p>`;

      const o = await lookupOrder(q);
      if (!o){
        box.innerHTML = `
          <div class="bg-red-50 border border-red-300 text-red-700 p-3 rounded">
            Không tìm thấy đơn hàng. Vui lòng kiểm tra lại mã đơn hàng hoặc email.
          </div>`;
      } else {
        box.innerHTML = `
          <div class="bg-green-50 border border-green-300 text-gray-800 p-3 rounded leading-7">
            <p><b>Tình trạng:</b> ${toStatusText(o.status)}</p>
            <p><b>Ngày đặt:</b> ${o.ordered_at || '-'}</p>
            <p><b>Mã vận đơn:</b> ${o.tracking || '-'}</p>
            <p class="text-sm text-gray-500 mt-1">Đơn <b>#${o.id}</b> — ${o.email || ''}</p>
          </div>`;
      }

      box.classList.remove('hidden');
    });

    // Nếu có ?q= trong URL thì tự tra
    const usp = new URLSearchParams(location.search);
    const q0 = usp.get('q');
    if (q0){
      input.value = q0;
      form.dispatchEvent(new Event('submit'));
    }
  });
  </script>
</body>
</html>
