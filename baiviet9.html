<!doctype html>
<html lang="vi">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunwin Casino</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
        body {
            box-sizing: border-box;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', Arial, sans-serif;
            background: linear-gradient(135deg, #0B0014 0%, #1a0033 50%, #2d0066 100%);
            color: white;
            min-height: 100%;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .floating-element {
            position: absolute;
            font-size: 60px;
            opacity: 0.3;
            animation: float 15s infinite linear;
        }

        .dragon {
            color: #E9C15B;
            text-shadow: 0 0 20px rgba(233, 193, 91, 0.8);
        }

        .phoenix {
            color: #D4302F;
            text-shadow: 0 0 20px rgba(212, 48, 47, 0.8);
        }

        .sparkle {
            color: #A600FF;
            font-size: 30px;
            text-shadow: 0 0 15px rgba(166, 0, 255, 0.8);
        }

        @keyframes float {
            0% {
                transform: translateX(-100px) translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateX(calc(100vw + 100px)) translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .twinkling-stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #E9C15B;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        html, body {
            height: 100%;
        }

        .container {
            min-height: 100%;
            position: relative;
        }

        /* Header Styles */
        .header {
            background: linear-gradient(135deg, #D4302F 0%, #A600FF 50%, #E9C15B 100%);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(212, 48, 47, 0.3);
            position: relative;
            z-index: 100;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(212, 48, 47, 0.8), rgba(166, 0, 255, 0.8), rgba(233, 193, 91, 0.8));
            backdrop-filter: blur(10px);
            z-index: -1;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #E9C15B, #D4302F);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(233, 193, 91, 0.6);
            border: 2px solid #E9C15B;
        }

        .balance {
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #E9C15B;
            box-shadow: 0 0 15px rgba(233, 193, 91, 0.4);
        }

        .balance-amount {
            color: #E9C15B;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(233, 193, 91, 0.8);
        }

        .menu-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .menu-icon:hover {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        /* Navigation Menu */
        .nav-menu {
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .nav-item {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item:hover, .nav-item.active {
            background: linear-gradient(135deg, #E9C15B, #D4302F);
            border-color: #E9C15B;
            box-shadow: 0 0 20px rgba(233, 193, 91, 0.6);
            transform: translateY(-2px);
        }

        /* Game Grid */
        .games-grid {
            padding: 30px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: linear-gradient(135deg, #E9C15B 0%, #D4302F 100%);
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 25px rgba(233, 193, 91, 0.4);
            border: 3px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #E9C15B, #A600FF, #E9C15B);
            border-radius: 22px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .game-card:hover::before {
            opacity: 1;
        }

        .game-card:hover {
            transform: scale(1.05) translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 40px rgba(233, 193, 91, 0.8);
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 15px;
            display: block;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .dice-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .dice {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #ddd;
        }

        .game-title {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            color: white;
        }

        /* Tài Xỉu Page Styles */
        .taixiu-container {
            display: none;
            min-height: 100%;
            padding: 20px;
            position: relative;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #E9C15B, #D4302F);
            border: none;
            padding: 12px 20px;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(233, 193, 91, 0.8);
        }

        .timer-display {
            text-align: center;
            margin: 20px 0;
            font-size: 36px;
            font-weight: bold;
            color: #E9C15B;
            text-shadow: 0 0 20px rgba(233, 193, 91, 0.8);
        }

        .game-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .bet-option {
            background: linear-gradient(135deg, rgba(212, 48, 47, 0.9), rgba(233, 193, 91, 0.9));
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.2),
                0 0 30px rgba(233, 193, 91, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(233, 193, 91, 0.5);
            min-width: 200px;
            position: relative;
            overflow: hidden;
        }

        .bet-option::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .bet-option:hover::before {
            opacity: 1;
            animation: shimmer 1.5s ease-in-out infinite;
        }

        .bet-option:hover {
            transform: scale(1.03) translateY(-5px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.3),
                0 0 50px rgba(233, 193, 91, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-color: rgba(233, 193, 91, 0.8);
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .bet-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .bet-button {
            background: linear-gradient(135deg, #E9C15B, #D4302F);
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bet-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(233, 193, 91, 0.8);
        }

        .dice-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
        }

        .xoc-dia-bowl {
            width: 200px;
            height: 120px;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 
                inset 0 -20px 40px rgba(0, 0, 0, 0.3),
                0 15px 30px rgba(0, 0, 0, 0.4),
                0 0 30px rgba(233, 193, 91, 0.3);
            border: 4px solid #DAA520;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.5s ease;
        }

        .xoc-dia-bowl::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 20px;
            right: 20px;
            height: 8px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
        }

        .xoc-dia-bowl::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 20px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.3), transparent);
            border-radius: 50%;
        }

        .dice-container-bowl {
            display: flex;
            gap: 8px;
            z-index: 2;
        }

        .game-dice {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #fff, #f8f8f8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #ddd;
            transition: transform 0.5s ease;
        }

        .xoc-dia-bowl.rolling {
            animation: shakeBowl 1s ease-in-out;
        }

        .game-dice.rolling {
            animation: rollInBowl 1s ease-in-out;
        }

        @keyframes shakeBowl {
            0%, 100% { transform: rotate(0deg); }
            10% { transform: rotate(-2deg) scale(1.02); }
            20% { transform: rotate(2deg) scale(1.02); }
            30% { transform: rotate(-2deg) scale(1.02); }
            40% { transform: rotate(2deg) scale(1.02); }
            50% { transform: rotate(-1deg) scale(1.01); }
            60% { transform: rotate(1deg) scale(1.01); }
            70% { transform: rotate(-1deg) scale(1.01); }
            80% { transform: rotate(1deg) scale(1.01); }
            90% { transform: rotate(0deg) scale(1); }
        }

        @keyframes rollInBowl {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(0.8); }
            50% { transform: rotate(180deg) scale(0.9); }
            75% { transform: rotate(270deg) scale(0.8); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .chat-panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 320px;
            height: 450px;
            background: linear-gradient(135deg, rgba(11, 0, 20, 0.95), rgba(26, 0, 51, 0.95));
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 2px solid rgba(233, 193, 91, 0.4);
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(233, 193, 91, 0.2);
        }

        .chat-header {
            text-align: center;
            padding: 10px 0 15px 0;
            border-bottom: 2px solid rgba(233, 193, 91, 0.3);
            margin-bottom: 15px;
            font-weight: bold;
            color: #E9C15B;
            text-shadow: 0 0 10px rgba(233, 193, 91, 0.8);
            font-size: 16px;
        }

        .chat-message {
            background: linear-gradient(135deg, rgba(233, 193, 91, 0.15), rgba(212, 48, 47, 0.15));
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            font-size: 13px;
            border-left: 4px solid #E9C15B;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .chat-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .chat-message:hover::before {
            opacity: 1;
        }

        .chat-message:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 25px rgba(233, 193, 91, 0.3);
        }

        .chat-username {
            color: #E9C15B;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(233, 193, 91, 0.6);
        }

        .chat-text {
            color: #ffffff;
            margin-left: 5px;
        }

        .popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .popup-content {
            background: linear-gradient(135deg, #D4302F, #A600FF);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 3px solid #E9C15B;
            box-shadow: 0 0 50px rgba(233, 193, 91, 0.8);
        }

        .popup-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .result-display {
            text-align: center;
            margin: 30px 0;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(233, 193, 91, 0.8);
            opacity: 0;
            transition: all 0.5s ease;
        }

        .result-display.show {
            opacity: 1;
            animation: resultPulse 1s ease-in-out;
        }

        @keyframes resultPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .fade-transition {
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .fade-transition.active {
            opacity: 1;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .header {
                padding: 10px 15px;
            }

            .user-info {
                gap: 10px;
            }

            .avatar {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }

            .balance {
                padding: 6px 12px;
            }

            .balance-amount {
                font-size: 14px;
            }

            .nav-menu {
                gap: 15px;
                padding: 15px;
            }

            .nav-item {
                padding: 8px 16px;
                font-size: 14px;
            }

            .games-grid {
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                padding: 20px 15px;
            }

            .game-card {
                padding: 25px;
            }

            .game-icon {
                font-size: 50px;
            }

            .dice {
                width: 35px;
                height: 35px;
                font-size: 20px;
            }

            .game-title {
                font-size: 18px;
            }

            .game-area {
                flex-direction: column;
                gap: 20px;
            }

            .bet-option {
                min-width: 180px;
                padding: 30px;
            }

            .bet-title {
                font-size: 36px;
            }

            .timer-display {
                font-size: 28px;
            }

            .game-dice {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }

            .chat-panel {
                width: 280px;
                height: 350px;
                right: 10px;
                padding: 15px;
            }

            .chat-header {
                font-size: 14px;
                padding: 8px 0 12px 0;
            }

            .chat-message {
                padding: 10px 12px;
                font-size: 12px;
                margin-bottom: 8px;
            }

            .popup-content {
                margin: 20px;
                padding: 30px;
            }

            .result-display {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            .games-grid {
                grid-template-columns: 1fr;
            }

            .bet-option {
                min-width: 150px;
                padding: 20px;
            }

            .bet-title {
                font-size: 28px;
            }

            .chat-panel {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                width: 100%;
                margin: 20px 0;
                height: 300px;
                padding: 15px;
            }

            .chat-header {
                font-size: 14px;
            }

            .chat-message {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
    </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>

 </head>

        </div>
        <div class="game-dice" id="dice2">
         ⚂
        </div>
        <div class="game-dice" id="dice3">
         ⚃
        </div>
       </div>
      </div>
     </div>
     <div class="bet-option" id="xiuOption">
      <div class="bet-title">
       XỈU
      </div><button class="bet-button" data-bet="xiu">ĐẶT CƯỢC</button>
     </div>
    </div>
    <div class="result-display" id="resultDisplay"></div>
    <div class="chat-panel" id="chatPanel">
     <div class="chat-header">
      💬 CHAT TRỰC TIẾP
     </div>
     <div class="chat-message"><span class="chat-username">Huấn Hoa Hồng:</span> <span class="chat-text">Tất tay Xỉu ae ơi! 💰</span>
     </div>
     <div class="chat-message"><span class="chat-username">chuluu:</span> <span class="chat-text">Về bờ rồi các bác! 🔥</span>
     </div>
     <div class="chat-message"><span class="chat-username">vietbeti:</span> <span class="chat-text">Lên Tài nào anh em! 🚀</span>
     </div>
    </div>
   </div><!-- POPUP -->
   <div class="popup" id="betPopup">
    <div class="popup-content">
     <div class="popup-title" id="popupTitle">
      Bạn đã cược thành công!
     </div>
    </div>
   </div>
  </div>
  <script>
        // Configuration object
        const defaultConfig = {
            user_balance: "999,999",
            username: "Player123",
            taixiu_title: "Tài Xỉu",
            bet_amount: "10,000"
        };

        let config = { ...defaultConfig };

        // Game state
        let gameTimer = 10;
        let gameInterval;
        let chatInterval;
        let currentBet = null;

        const diceSymbols = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
        const chatMessages = [
            "Huấn Hoa Hồng: Tất tay Xỉu ae ơi! 💰",
            "hoangpiuu: Về bờ rồi các bác! 🔥",
            "Huấn Hoa Hồng: Lên Tài nào anh em! 🚀",
            "hoangpiuu: Ăn to rồi! Xỉu chắc chắn! 💎",
            "Huấn Hoa Hồng: All in Tài đi! 🎯",
            "hoangpiuu: Xỉu về đi ae! 🎰",
            "Huấn Hoa Hồng: Tài lên mạnh! 💪",
            "hoangpiuu: Chốt Xỉu nào! ⚡",
            "Huấn Hoa Hồng: Ăn nhanh về sớm! 🏆",
            "hoangpiuu: Tài Xỉu gì cũng ăn! 🎊"
        ];

        // Initialize app
        function initApp() {
            setupEventListeners();
            updateUI();
            startChatMessages();
            createAnimatedBackground();
        }

        function createAnimatedBackground() {
            const animatedBg = document.querySelector('.animated-bg');
            const twinklingStars = document.querySelector('.twinkling-stars');
            
            // Create floating dragons and phoenixes
            function createFloatingElement() {
                const element = document.createElement('div');
                element.className = 'floating-element';
                
                const symbols = ['🐉', '🔥', '🌟', '✨', '💫'];
                const classes = ['dragon', 'phoenix', 'sparkle', 'sparkle', 'sparkle'];
                const randomIndex = Math.floor(Math.random() * symbols.length);
                
                element.textContent = symbols[randomIndex];
                element.classList.add(classes[randomIndex]);
                
                // Random starting position
                element.style.left = Math.random() * 100 + 'vw';
                element.style.animationDelay = Math.random() * 15 + 's';
                element.style.animationDuration = (15 + Math.random() * 10) + 's';
                
                animatedBg.appendChild(element);
                
                // Remove element after animation
                setTimeout(() => {
                    if (element.parentNode) {
                        element.parentNode.removeChild(element);
                    }
                }, 25000);
            }
            
            // Create twinkling stars
            function createStars() {
                for (let i = 0; i < 50; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    star.style.animationDuration = (2 + Math.random() * 2) + 's';
                    twinklingStars.appendChild(star);
                }
            }
            
            // Initialize stars
            createStars();
            
            // Create floating elements periodically
            setInterval(createFloatingElement, 3000);
            
            // Create initial floating elements
            for (let i = 0; i < 3; i++) {
                setTimeout(createFloatingElement, i * 1000);
            }
        }

        function setupEventListeners() {
            // Navigation
            document.getElementById('taixiuCard').addEventListener('click', showTaixiuPage);
            document.getElementById('backButton').addEventListener('click', showHomePage);

            // Betting
            document.querySelectorAll('.bet-button').forEach(button => {
                button.addEventListener('click', (e) => {
                    const betType = e.target.getAttribute('data-bet');
                    placeBet(betType);
                });
            });

            // Menu items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
        }

        function updateUI() {
            document.getElementById('balanceAmount').textContent = (config.user_balance || defaultConfig.user_balance) + ' ₫';
            document.getElementById('userAvatar').textContent = (config.username || defaultConfig.username).charAt(0).toUpperCase();
            document.getElementById('taixiuTitle').textContent = config.taixiu_title || defaultConfig.taixiu_title;
        }

        function showTaixiuPage() {
            const homePage = document.getElementById('homePage');
            const taixiuPage = document.getElementById('taixiuPage');
            
            homePage.classList.remove('active');
            setTimeout(() => {
                homePage.style.display = 'none';
                taixiuPage.style.display = 'block';
                setTimeout(() => {
                    taixiuPage.classList.add('fade-transition', 'active');
                    startGame();
                }, 50);
            }, 500);
        }

        function showHomePage() {
            const homePage = document.getElementById('homePage');
            const taixiuPage = document.getElementById('taixiuPage');
            
            stopGame();
            taixiuPage.classList.remove('active');
            setTimeout(() => {
                taixiuPage.style.display = 'none';
                homePage.style.display = 'block';
                setTimeout(() => {
                    homePage.classList.add('active');
                }, 50);
            }, 500);
        }

        function startGame() {
            gameTimer = 10;
            currentBet = null;
            document.getElementById('resultDisplay').classList.remove('show');
            updateTimer();
            
            gameInterval = setInterval(() => {
                gameTimer--;
                updateTimer();
                
                if (gameTimer <= 0) {
                    rollDice();
                    gameTimer = 10;
                }
            }, 1000);
        }

        function stopGame() {
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
        }

        function updateTimer() {
            document.getElementById('timerDisplay').textContent = gameTimer;
        }

        function placeBet(betType) {
            currentBet = betType;
            const popup = document.getElementById('betPopup');
            const popupTitle = document.getElementById('popupTitle');
            
            popupTitle.textContent = `Bạn đã cược ${betType.toUpperCase()} thành công!`;
            popup.style.display = 'flex';
            
            setTimeout(() => {
                popup.style.display = 'none';
            }, 2000);
        }

        function rollDice() {
            const dice1 = document.getElementById('dice1');
            const dice2 = document.getElementById('dice2');
            const dice3 = document.getElementById('dice3');
            const bowl = document.getElementById('xocDiaBowl');
            
            // Add rolling animation to bowl and dice
            bowl.classList.add('rolling');
            [dice1, dice2, dice3].forEach(dice => {
                dice.classList.add('rolling');
            });
            
            setTimeout(() => {
                // Generate random dice values
                const value1 = Math.floor(Math.random() * 6) + 1;
                const value2 = Math.floor(Math.random() * 6) + 1;
                const value3 = Math.floor(Math.random() * 6) + 1;
                
                dice1.textContent = diceSymbols[value1 - 1];
                dice2.textContent = diceSymbols[value2 - 1];
                dice3.textContent = diceSymbols[value3 - 1];
                
                // Remove rolling animation
                bowl.classList.remove('rolling');
                [dice1, dice2, dice3].forEach(dice => {
                    dice.classList.remove('rolling');
                });
                
                // Calculate result
                const total = value1 + value2 + value3;
                const result = total >= 11 ? 'tai' : 'xiu';
                showResult(result, total);
            }, 1000);
        }

        function showResult(result, total) {
            const resultDisplay = document.getElementById('resultDisplay');
            const resultText = result === 'tai' ? 'TÀI THẮNG' : 'XỈU THẮNG';
            
            resultDisplay.textContent = `${resultText} (${total})`;
            resultDisplay.style.color = result === 'tai' ? '#E9C15B' : '#D4302F';
            resultDisplay.classList.add('show');
            
            // Check if player won
            if (currentBet && currentBet === result) {
                setTimeout(() => {
                    const popup = document.getElementById('betPopup');
                    const popupTitle = document.getElementById('popupTitle');
                    popupTitle.textContent = `🎉 Chúc mừng! Bạn đã thắng ${config.bet_amount || defaultConfig.bet_amount} ₫!`;
                    popup.style.display = 'flex';
                    
                    setTimeout(() => {
                        popup.style.display = 'none';
                    }, 3000);
                }, 1000);
            }
        }

        function startChatMessages() {
            chatInterval = setInterval(() => {
                const chatPanel = document.getElementById('chatPanel');
                const randomMessage = chatMessages[Math.floor(Math.random() * chatMessages.length)];
                
                // Parse username and message
                const [username, ...messageParts] = randomMessage.split(': ');
                const messageText = messageParts.join(': ');
                
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message';
                
                const usernameSpan = document.createElement('span');
                usernameSpan.className = 'chat-username';
                usernameSpan.textContent = username + ':';
                
                const textSpan = document.createElement('span');
                textSpan.className = 'chat-text';
                textSpan.textContent = messageText;
                
                messageDiv.appendChild(usernameSpan);
                messageDiv.appendChild(textSpan);
                
                chatPanel.appendChild(messageDiv);
                
                // Keep only last 12 messages (including header)
                while (chatPanel.children.length > 13) {
                    // Skip the header (first child)
                    if (chatPanel.children[1]) {
                        chatPanel.removeChild(chatPanel.children[1]);
                    }
                }
                
                chatPanel.scrollTop = chatPanel.scrollHeight;
            }, 4000);
        }

        // Element SDK Integration
        async function onConfigChange(newConfig) {
            config = { ...config, ...newConfig };
            updateUI();
        }

        function mapToCapabilities(config) {
            return {
                recolorables: [],
                borderables: [],
                fontEditable: undefined,
                fontSizeable: undefined
            };
        }

        function mapToEditPanelValues(config) {
            return new Map([
                ["user_balance", config.user_balance || defaultConfig.user_balance],
                ["username", config.username || defaultConfig.username],
                ["taixiu_title", config.taixiu_title || defaultConfig.taixiu_title],
                ["bet_amount", config.bet_amount || defaultConfig.bet_amount]
            ]);
        }

        // Initialize Element SDK
        if (window.elementSdk) {
            window.elementSdk.init({
                defaultConfig,
                onConfigChange,
                mapToCapabilities,
                mapToEditPanelValues
            });
        }

        // Start the app
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
